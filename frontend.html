<!DOCTYPE html>
<html>
<head>
    <title>AI Money Mentor</title>
</head>

<body style="font-family:Arial; background:linear-gradient(135deg,#1f4037,#99f2c8);">

<div style="width:400px; margin:50px auto; background:white; padding:20px; border-radius:10px; text-align:center;">

<h2>🤖 AI Money Mentor</h2>

<!-- ✅ EXISTING INPUTS -->
<input id="income" placeholder="Income"><br><br>
<input id="expenses" placeholder="Expenses"><br><br>

<button onclick="analyze()">Analyze</button>

<!-- ✅ EXISTING RESULT -->
<h3 id="result"></h3>

<hr>

<!-- 🤖 NEW CHATBOT SECTION -->
<h3>💬 Ask AI Advisor</h3>
<input id="chatInput" placeholder="Ask anything..." style="width:70%;">
<button onclick="sendMessage()">Send</button>

<p id="chatResponse"></p>

</div>

<script>

let userData = {};  // store user info

// ✅ EXISTING ANALYZE FUNCTION (UNCHANGED + small add)
async function analyze() {
    let income = document.getElementById("income").value;
    let expenses = document.getElementById("expenses").value;

    userData = {income, expenses};  // store for chatbot

    let res = await fetch("http://127.0.0.1:5000/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ income, expenses })
    });

    let data = await res.json();

    document.getElementById("result").innerHTML =
        "💰 Savings: ₹" + data.savings + "<br>" +
        "📊 Score: " + data.score + "<br>" +
        "💡 " + data.message + "<br>" +
        "📈 Investment: " + data.investment;
}


// 🤖 NEW CHATBOT FUNCTION
async function sendMessage() {
    let msg = document.getElementById("chatInput").value;

    let res = await fetch("http://127.0.0.1:5000/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            message: msg,
            income: userData.income,
            expenses: userData.expenses
        })
    });

    let data = await res.json();

    document.getElementById("chatResponse").innerHTML =
        "🤖 " + data.reply;
}

</script>

</body>
</html>
