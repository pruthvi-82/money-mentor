<!DOCTYPE html>
<html>
<head>
    <title>AI Money Mentor</title>
</head>

<body style="
    margin:0;
    font-family:Arial;
    background: linear-gradient(135deg, #1f4037, #99f2c8);
">

<div style="
    width:380px;
    margin:80px auto;
    padding:25px;
    background: rgba(255,255,255,0.95);
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
">

    <h2 style="color:#2c3e50;">🤖 AI Money Mentor</h2>
    <p style="color:#555; font-size:14px;">
        Smart financial guidance powered by AI
    </p>

    <input id="income" placeholder="💰 Enter Income" 
    style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;"><br>

    <input id="expenses" placeholder="💸 Enter Expenses" 
    style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;"><br>

    <input id="goal" placeholder="🎯 Savings Goal" 
    style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;"><br>

    <button onclick="analyze()" 
    style="
        padding:12px 25px;
        background: linear-gradient(to right, #ff512f, #dd2476);
        color:white;
        border:none;
        border-radius:8px;
        cursor:pointer;
        font-size:16px;
        font-weight:bold;
    ">
    🚀 Analyze Now
    </button>

    <h3 id="result" style="margin-top:20px;"></h3>

</div>

<script>
async function analyze() {
    let income = document.getElementById("income").value;
    let expenses = document.getElementById("expenses").value;
    let goal = document.getElementById("goal").value;

    let response = await fetch("http://127.0.0.1:5000/analyze", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ income, expenses, goal })
    });

    let data = await response.json();

    let color = (data.score > 7) ? "green" : "red";

    document.getElementById("result").innerHTML =
        "<div style='color:" + color + "; font-weight:bold'>" +
        "💵 Savings: ₹" + data.savings + "<br>" +
        "📊 Score: " + data.score + "<br>" +
        "💡 " + data.message +
        "</div>";
}
</script>

</body>
</html>
